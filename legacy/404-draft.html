<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — The Kitchen Lab Manual</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='88'%3E🍳%3C/text%3E%3C/svg%3E">
<style>
  :root{ --ground:#e7e4dc; --ink:#191c1d; --ink-soft:#4c514f; --ember:#c2481d; --line:#cdc9be; }
  @media (prefers-color-scheme:dark){ :root{ --ground:#141718; --ink:#ece9e1; --ink-soft:#aab0ad; --ember:#e46232; --line:#333b3c; } }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);
    font-family:"Iowan Old Style","Charter",Palatino,Georgia,serif;padding:32px;text-align:center}
  .card{max-width:34rem}
  .code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ember)}
  h1{font-family:"Helvetica Neue",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;font-size:clamp(30px,6vw,46px);margin:.4em 0 .2em}
  p{color:var(--ink-soft);font-size:18px;line-height:1.6;margin:0 0 1.6em}
  a{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:12px 18px}
  a:hover{border-color:var(--ember)}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404 · Off the recipe</div>
    <h1>That page isn't on the menu.</h1>
    <p>The link may be stale, or the dish never existed. Head back to the syllabus and start from the mental model.</p>
    <a href="/">← Back to the manual</a>
  </div>
</body>
</html>
