<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="The Kitchen Lab Manual — a bilingual home-cooking curriculum that treats the kitchen as a control system."
    />
    <meta name="theme-color" content="#e7e4dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141718" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='88'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E"
    />
    <title>The Kitchen Lab Manual</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("klm.theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        var l = localStorage.getItem("klm.lang");
        if (l === "en" || l === "es") document.documentElement.setAttribute("lang", l);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
